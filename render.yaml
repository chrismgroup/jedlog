services:
  - type: web
    name: jedlog
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: npm ci
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Set to the *Internal* Database URL of Render Postgres instance dpg-davb8mu7bikc73dcouo0-a.
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: ""
      - key: EXPO_ACCESS_TOKEN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_PHONE
        sync: false
